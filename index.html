<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H0PE ART SERVICE</title>

<!-- Luxus-Schrift für VIP -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-image: url("assets/stuff/breakfree.png");
  background-repeat: repeat;
  position: relative; /* für VIP-PNG Layer */
}

/* ================= INTRO ================= */
.text-container {
  max-width: 600px;
  margin: 80px 20px;
  padding: 30px;
  background: linear-gradient(135deg, #067506, #f0d507, #d60909);
  color: white;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
  margin-top: 0;
  letter-spacing: 2px;
  font-weight: normal;
}

/* ================= EXHIBITIONS ================= */
.exhibition-list {
  list-style: none;
  padding: 0;
  margin: 120px 20px;
  position: relative; /* VIP-PNGs sollen dahinter sein */
  z-index: 1;
}

.exhibition-item {
  display: flex;
  margin-bottom: 140px;
}

.exhibition-item a {
  text-decoration: none;
  color: black;
  max-width: 650px;
  display: flex;
  flex-direction: column;
}

.exhibition-item:nth-child(odd) { justify-content: flex-start; }
.exhibition-item:nth-child(even) { justify-content: flex-end; }

.exhibition-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: 0.3s ease;
}

.exhibition-item img:hover { transform: scale(1.02); }

.exhibition-item p {
  margin-top: 15px;
  padding: 10px 14px;
  font-family: "Times New Roman", serif;
  letter-spacing: 1px;
  border-radius: 6px;
  display: inline-block;
  transition: 0.3s ease;
}

.exhibition-item:nth-child(3n+1) p { background: #067506; color: white; }
.exhibition-item:nth-child(3n+2) p { background: #f0d507; color: black; }
.exhibition-item:nth-child(3n+3) p { background: #d60909; color: white; }

.exhibition-item p:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ================= VIP THEME ================= */
body.vip-theme {
  font-family: 'Cinzel Decorative', serif;
}

/* VIP Text & Images */
body.vip-theme .text-container {
  background: #d4af37;
  color: black;
  border: 16px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item p {
  background: #d4af37;
  color: black;
  border: 10px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item img {
  border: 14px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  border-radius: 10px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.4);
}

/* ================= VIP PNG Layer ================= */
#vip-layer {
  display: none; /* nur bei VIP aktiv */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0; /* hinter allen Inhalten */
  pointer-events: none;
}

/* ================= NEWSLETTER ================= */
.newsletter {
  margin: 100px 20px;
  padding: 20px;
  background: white;
  max-width: 600px;
}

/* ================= BUTTONS ================= */
.language-toggle, .theme-toggle {
  position: fixed;
  right: 15px;
  z-index: 1000;
}

.language-toggle { top: 15px; }
.theme-toggle { top: 60px; }

button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #1f5f2e;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: #d4af37; }

/* ================= CHILL MODE ================= */
.chill-mode-toggle {
  position: fixed;
  bottom: 15px;
  right: 15px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

body.chill-mode {
  background: url('green.gif') center center fixed;
  background-size: cover;
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
  .text-container { margin: 40px 15px; padding: 20px; }
  .exhibition-list { margin: 60px 15px; }
  .exhibition-item { display: block; margin-bottom: 80px; }
  .exhibition-item a { display: block; max-width: 100%; }
  .exhibition-item img { margin-bottom: 12px; }
  .exhibition-item p { display: block; width: fit-content; max-width: 100%; font-size: 16px; padding: 8px 12px; text-align: left; transform: none; }
}

</style>
</head>

<script>
// ===== Chill Mode =====
function toggleChillMode() {
  document.body.classList.toggle('chill-mode');
}

// ===== Language Switch =====
const langBtn = document.getElementById('langBtn');
let currentLang = 'en';

langBtn.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'de' : 'en';
  langBtn.textContent = currentLang === 'en' ? 'DE' : 'EN';

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute(`data-${currentLang}`);
  });
});

// ===== Theme Switch =====
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('vip-theme');
  themeBtn.textContent = document.body.classList.contains('vip-theme') ? 'RAGGAE' : 'VIP';

  if (document.body.classList.contains('vip-theme')) {
    distributeVIPPNGs();
  } else {
    document.getElementById('vip-layer').style.display = 'none';
  }
});

// ===== VIP PNG Distribution mitscrollend mit leichtem Random-Offset =====
function distributeVIPPNGs() {
  const layer = document.getElementById('vip-layer');
  layer.innerHTML = '';
  layer.style.display = 'block';

  const pngs = [
    'assets/stuff/gold_h.png',
    'assets/stuff/gold_o.png',
    'assets/stuff/gold_p.png',
    'assets/stuff/gold_e.png',
 
  ];

  const bodyWidth = document.body.scrollWidth;
  const bodyHeight = document.body.scrollHeight;
  const pngSize = 200;
  const spacingX = pngSize;
  const spacingY = pngSize;
  const maxOffset = 50;

  const cols = Math.ceil(bodyWidth / spacingX);
  const rows = Math.ceil(bodyHeight / spacingY);

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const img = document.createElement('img');
      img.src = pngs[(col + row) % pngs.length];
      img.style.position = 'absolute';
      
      const offsetX = Math.floor(Math.random() * maxOffset * 2 - maxOffset);
      const offsetY = Math.floor(Math.random() * maxOffset * 2 - maxOffset);

      img.style.left = `${col * spacingX + offsetX}px`;
      img.style.top = `${row * spacingY + offsetY}px`;
      img.style.width = `${pngSize}px`;
      img.style.height = `${pngSize}px`;
      layer.appendChild(img);
    }
  }
}

</script>
