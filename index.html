<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H0PE ART SERVICE</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-image: url("assets/stuff/breakfree.png");
  background-repeat: repeat;
}

/* ================= INTRO ================= */

.text-container {
  max-width: 600px;
  margin: 80px 20px;
  padding: 30px;
  background: linear-gradient(135deg, #067506, #f0d507, #d60909);
 background-image:url('assets/stuff/raggae.jpg');
  color: white;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
  margin-top: 0;
  letter-spacing: 2px;
  font-weight: normal;
}

/* ================= EXHIBITIONS ================= */

.exhibition-list {
  list-style: none;
  padding: 0;
  margin: 120px 20px;
}

.exhibition-item {
  margin-bottom: 120px;
}

.exhibition-item a {
  text-decoration: none;
  color: black;
  display: inline-block;
  max-width: 650px;
}

.exhibition-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: 0.3s ease;
}

.exhibition-item img:hover {
  transform: scale(1.02);
}

/* Reggae text colors rotation */

.exhibition-item p {
  margin-top: 15px;
  padding: 10px 14px;
  font-family: "Times New Roman", serif;
  letter-spacing: 1px;
  border-radius: 6px;
  display: inline-block;
  transition: 0.3s ease;
}

.exhibition-item:nth-child(3n+1) p {
  background: #067506;
  color: white;
}

.exhibition-item:nth-child(3n+2) p {
  background: #f0d507;
  color: black;
}

.exhibition-item:nth-child(3n+3) p {
  background: #d60909;
  color: white;
}

.exhibition-item p:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ================= VIP THEME ================= */

body.vip-theme {
  font-family: 'Cinzel Decorative', serif;
  background-image:url('assets/stuff/breakfree_goldornament.png');
}

/* VIP Intro */

body.vip-theme .text-container {
  background: #d4af37;
  color: black;
  border: 16px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

/* VIP Exhibition Text */

body.vip-theme .exhibition-item p {
  background: #d4af37;
  color: black;
  border: 10px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* VIP Images */

body.vip-theme .exhibition-item img {
  border: 14px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  border-radius: 10px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.4);
}

/* ================= NEWSLETTER ================= */

.newsletter {
  margin: 100px 20px;
  padding: 20px;
  background: white;
  max-width: 600px;
}

/* ================= BUTTONS ================= */

.language-toggle,
.theme-toggle {
  position: fixed;
  right: 15px;
  z-index: 1000;
}

.language-toggle { top: 15px; }
.theme-toggle { top: 60px; }

button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #1f5f2e;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #d4af37;
}

/* ================= CHILL MODE ================= */

.chill-mode-toggle {
  position: fixed;
  bottom: 15px;
  right: 15px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

body.chill-mode {
  background: url('green.gif') center center fixed;
  background-size: cover;
}

/* ================= MOBILE ================= */

@media (max-width: 900px) {

  .text-container {
    margin: 40px 15px;
    padding: 20px;
  }

  .exhibition-list {
    margin: 60px 15px;
  }

  .exhibition-item {
    margin-bottom: 80px;
  }

  .exhibition-item a {
    display: block;
    max-width: 100%;
  }

  .exhibition-item img {
    margin-bottom: 12px;
  }

  .exhibition-item p {
    display: block;
    width: fit-content;
    max-width: 100%;
    font-size: 16px;
    padding: 8px 12px;
    text-align: left;
    transform: none;
  }

}

</style>
</head>

<body>

<div class="language-toggle">

</div>

<div class="text-container">
  <h1>H0PE ART SERVICE</h1>
  <p id="mainText"
     data-en="H0pe is a curatorial project initiated by Marcus Wagner in Newcastle Upon Tyne in 2024, with the wish to create his own curatorial structure and therefore freedom to present works in the way he likes to. H0pe organizes itself with regular open calls inviting everybody to submit. The program focusses on a fun experimental approach to exhibition making and likes to concentrate on the effect of an exhibition more than the single work. Themes are choosen to generate a wide range of submissions and transform a simple topic into a vivid show, guiding back to the viewer and telling something about contemporary art production itself. Everybody is invited to contribute."
     data-de="H0pe ist ein kuratorisches Projekt, das 2024 von Marcus Wagner mit dem Ziel initiiert wurde  eine eigenständige Plattform zu schaffen, die kuratorische Unabhängigkeit in Auswahl der Werke und Präsentationsformen ermöglicht. Der Zugang zur Entwicklung von Ausstellungsprojekten hat eine grundsätzlich experimentelle, etwas provokative und offene Haltung und wird von einem gewissen Leichtsinn getragen. Meistens steht weniger das einzelne Werk als vielmehr die Stimmung und Gesamtwirkung der Präsentation im Mittelpunkt.
Gewählte Themen sind häufig etwas banal und befassen sich mit Symbolik von Objekten und Worten. Durch die Wahl von simplen, einfach aufzufassenden Themen soll Bandbreite an Einreichungen vergrößert werden und gleichzeitig  eine Wechselwirkung zwischen Thema und Werk entstehen die auf den Betrachter zurück verweist und etwas über gegenwärtige künstlerische Produktionsweisen aussagen soll. Jede/r kann bei dem Projekt einreichen.">
    About H0pe...
  </p>
</div>

<script>

function toggleChillMode() {
  document.body.classList.toggle('chill-mode');
}

const langBtn = document.getElementById('langBtn');
let currentLang = 'en';

langBtn.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'de' : 'en';
  langBtn.textContent = currentLang === 'en' ? 'DE' : 'EN';

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute(`data-${currentLang}`);
  });
});

const themeBtn = document.getElementById('themeBtn');

themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('vip-theme');
  themeBtn.textContent =
    document.body.classList.contains('vip-theme') ? 'RAGGAE' : 'VIP';
});

</script>

</body>
