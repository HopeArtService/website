<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H0PE ART SERVICE</title>

<!-- Luxus-Schrift für VIP -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ===== Base ===== */
html, body {
  width: 100%;
  margin: 0;
  padding: 10px;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background-image: url("assets/stuff/breakfree.png");
  background-repeat: repeat;
  transition: all 0.5s ease;
}

/* ===== Intro Text-Container ===== */
.text-container {
  max-width: 520px;
  margin: 80px 0 80px 20px;
  padding: 30px;
  border-radius: 5px;
  transition: all 0.5s ease;
  text-align: left; /* immer linksbündig */
  color: black;
  background-color: white;
}

/* VIP & Reggae Effekte auf Text Container */
body.vip-theme .text-container {
  background-color: #d4af37;
  color: black;
  font-family: 'Cinzel Decorative', serif;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
body:not(.vip-theme) .text-container:nth-of-type(1) {
  background-color: #1f5f2e;
  color: white;
}

/* ===== Header ===== */
h1 {
  font-size: 34px;
  font-weight: normal;
  letter-spacing: 2px;
  margin-bottom: 40px;
}

/* ===== Exhibition List ===== */
.exhibition-list {
  list-style: none;
  padding: 0;
  margin: 100px 0;
}

.exhibition-item {
  display: flex;
  margin-bottom: 80px;
  transition: all 0.5s ease;
  flex-direction: column;
  align-items: flex-start; /* immer linksbündig */
  max-width: 90vw; /* sehr groß, aber nicht full screen */
}

.exhibition-item a {
  text-decoration: none;
  color: black;
  max-width: 100%;
}

/* Textboxen unter den Bildern */
.exhibition-item p {
  margin-top: 15px;
  font-family: "Times New Roman", Times, serif;
  letter-spacing: 1px;
  padding: 10px;
  display: inline-block;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  cursor: default;
  transition: all 0.5s ease;
  text-align: left;
}

/* Reggae Textboxen */
.exhibition-item:nth-child(3n+1) p { background-color: #1f5f2e; color: white; }
.exhibition-item:nth-child(3n+2) p { background-color: #d4af37; color: black; }
.exhibition-item:nth-child(3n+3) p { background-color: #8b1e1e; color: white; }

/* Hover Textbox */
.exhibition-item p:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* ===== VIP Theme ===== */
body.vip-theme { font-family: 'Cinzel Decorative', serif; }

body.vip-theme .exhibition-item p {
  background-color: #d4af37 !important;
  color: black !important;
  border: 1px solid #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

/* VIP PNG Rahmen */
body.vip-theme .exhibition-item a span.vip-frame {
  position: relative;
  display: inline-block;
  width: 100%;
}

body.vip-theme .exhibition-item a span.vip-frame img.main-img {
  display: block;
  width: 90vw;
  max-width: 90vw;
  height: auto;
  border-radius: 0;
}

body.vip-theme .exhibition-item a span.vip-frame img.frame-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  object-fit: cover; /* passt sich immer der Bildgröße an */
}

/* Hover Effekt VIP */
body.vip-theme .exhibition-item a span.vip-frame img.main-img:hover {
  transform: scale(1.03);
  box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212,175,55,0.6) inset, 0 0 25px rgba(255,223,0,0.6);
}

/* ===== Newsletter ===== */
.newsletter { margin: 100px 0 100px 20px; background: white; padding: 10px; }

/* ===== Buttons ===== */
.language-toggle, .theme-toggle { position: fixed; right: 10px; z-index: 1000; }
.language-toggle { top: 10px; }
.theme-toggle { top: 50px; }
.language-toggle button, .theme-toggle button {
  padding: 8px 12px; font-size: 14px; border: none; border-radius: 5px;
  background-color: #1f5f2e; color: white; cursor: pointer; transition: background 0.3s;
}
.language-toggle button:hover, .theme-toggle button:hover { background-color: #d4af37; }

/* ===== Chill Mode ===== */
.chill-mode-toggle { position: fixed; bottom: 10px; right: 10px; color: white; font-weight: bold; cursor: pointer; }
.chill-mode { background: url('green.gif') no-repeat center center fixed; background-size: cover; }

/* ===== Mobile Anpassung ===== */
@media (max-width: 900px) {
  .exhibition-item {
    max-width: 95vw;
    padding-left: 15px !important;
    padding-right: 15px !important;
  }

  .exhibition-item p {
    font-size: 16px;
    max-width: 95%;
  }

  body.vip-theme .exhibition-item a span.vip-frame img.main-img,
  body.vip-theme .exhibition-item a span.vip-frame img.frame-overlay {
    width: 95%;
    height: auto;
  }
}
</style>
</head>

<body>

<!-- Buttons -->
<div class="language-toggle"><button id="langBtn">DE</button></div>
<div class="theme-toggle"><button id="themeBtn">VIP</button></div>

<!-- Intro -->
<div class="text-container" id="introText"
     data-en="H0pe is a curatorial project primarily run by Marcus Wagner. He founded the project in Newcastle Upon Tyne in 2024 with the wish to create his own curatorial structure and therefore freedom to present works. H0pe focusses on a fun experimental approach to exhibition making and puts its focus more on the effect of the exhibition than the single work. Themes are choosen to generate a wide range of submissions and transform a archaic topic into a vivid show telling something about art production itself. Everybody is invited to contribute."
     data-de="H0pe ist ein kuratorisches Projekt, das hauptsächlich von Marcus Wagner betrieben wird. Gegründet wurde das Projekt 2024 in Newcastle Upon Tyne mit dem Wunsch, eine eigene kuratorische Plattform und somit Freiheit in der Selektion und Form der Präsentation zu schaffen.
H0pe unternimmt experimentell, provokativ, spielerische Ausstellungeprojekte und legt den Fokus mehr auf die Wirkung der Show als des einzelnen Werks.
Die Themen sind oftmals banal und stark symbolisch aufgeladen um einerseits die Bandbreite der Einreichungen zu vergrößern und andererseits einen besonderen Moment aus der Reibung zwischen Thema und Werk zu generieren, was im besten Fall etwas über die zeitgenössische Kunstproduktion sagt. Jeder ist eingeladen, teilzunehmen.
  Welcome to H0PE Art Service...
</div>

<!-- Exhibition List -->
<ul class="exhibition-list">

<li class="exhibition-item">
  <a href="/carshow1.html">
    <span class="vip-frame">
      <img class="main-img" src="assets/car_compressed/marie_nah.jpg" alt="Jonas and Marie Car" />
      <img class="frame-overlay" src="assets/vip_frame.png" alt="Gold Frame Overlay" />
    </span>
    <p data-en="THE CAR SHOW I" data-de="DIE AUTO AUSSTELLUNG I">THE CAR SHOW I</p>
  </a>
</li>

<li class="exhibition-item">
  <a href="/nothingshow.html">
    <span class="vip-frame">
      <img class="main-img" src="assets/nothingshow/still3.png" alt="The Nothing Show" />
      <img class="frame-overlay" src="assets/vip_frame.png" alt="Gold Frame Overlay" />
    </span>
    <p data-en="THE NOTHING SHOW" data-de="DIE NICHTS AUSSTELLUNG">THE NOTHING SHOW</p>
  </a>
</li>

<li class="exhibition-item">
  <a href="/shoeshow2.html">
    <span class="vip-frame">
      <img class="main-img" src="assets/Shoeshow/emy2.jpg" alt="Shoe Show" />
      <img class="frame-overlay" src="assets/vip_frame.png" alt="Gold Frame Overlay" />
    </span>
    <p data-en="SHOE SHOW" data-de="SCHUH AUSSTELLUNG">SHOE SHOW</p>
  </a>
</li>

<li class="exhibition-item">
  <a href="/xmasshow.html">
    <span class="vip-frame">
      <img class="main-img" src="assets/xmasshow/1.jpg" alt="Hope Xmas Show" />
      <img class="frame-overlay" src="assets/vip_frame.png" alt="Gold Frame Overlay" />
    </span>
    <p data-en="HOPE XMAS SHOW" data-de="HOPE WEIHNACHTS SHOW">HOPE XMAS SHOW</p>
  </a>
</li>

</ul>

<!-- Newsletter -->
<div class="newsletter">
  <p id="newsletterText" data-en="Write us a Mail if you want to be on our Newsletter" data-de="Schreib uns eine Mail, wenn du in unseren Newsletter aufgenommen werden möchtest">
    Write us a Mail if you want to be on our Newsletter
  </p>
  <a href="mailto:hopeartservice@gmx.net">hopeartservice@gmx.net</a>
</div>

<!-- Chill Mode -->
<div class="chill-mode-toggle" onclick="toggleChillMode()">.</div>

<script>
// ===== Chill Mode =====
function toggleChillMode() { document.body.classList.toggle('chill-mode'); }

// ===== Language Switch =====
const langBtn = document.getElementById('langBtn');
let currentLang = 'en';
langBtn.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'de' : 'en';
  langBtn.textContent = currentLang === 'en' ? 'DE' : 'EN';
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute(`data-${currentLang}`);
  });
});

// ===== Theme Switch =====
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('vip-theme');
  themeBtn.textContent = document.body.classList.contains('vip-theme') ? 'RAGGAE' : 'VIP';
});
</script>

</body>
</html>
