<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H0PE ART SERVICE</title>

<!-- Luxus-Schrift für VIP -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-image: url("assets/stuff/breakfree.png");
  background-repeat: repeat;
}

/* ================= INTRO ================= */
.text-container {
  max-width: 600px;
  margin: 80px 20px;
  padding: 30px;
  background: linear-gradient(135deg, #067506, #f0d507, #d60909);
  color: white;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
  margin-top: 0;
  letter-spacing: 2px;
  font-weight: normal;
}

/* ================= EXHIBITIONS ================= */
.exhibition-list {
  list-style: none;
  padding: 0;
  margin: 120px 20px;
}

.exhibition-item {
  display: flex;
  margin-bottom: 140px;
}

.exhibition-item a {
  text-decoration: none;
  color: black;
  max-width: 650px;
  display: flex;
  flex-direction: column;
}

.exhibition-item:nth-child(odd) { justify-content: flex-start; }
.exhibition-item:nth-child(even) { justify-content: flex-end; }

.exhibition-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: 0.3s ease;
}

.exhibition-item img:hover { transform: scale(1.02); }

.exhibition-item p {
  margin-top: 15px;
  padding: 10px 14px;
  font-family: "Times New Roman", serif;
  letter-spacing: 1px;
  border-radius: 6px;
  display: inline-block;
  transition: 0.3s ease;
}

.exhibition-item:nth-child(3n+1) p { background: #067506; color: white; }
.exhibition-item:nth-child(3n+2) p { background: #f0d507; color: black; }
.exhibition-item:nth-child(3n+3) p { background: #d60909; color: white; }

.exhibition-item p:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ================= VIP THEME ================= */
body.vip-theme {
  font-family: 'Cinzel Decorative', serif;
  background-image: url('assets/stuff/breakfree_goldornament.png');
}

body.vip-theme .text-container {
  background: #d4af37;
  color: black;
  border: 16px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item p {
  background: #d4af37;
  color: black;
  border: 10px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item img {
  border: 14px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  border-radius: 10px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.4);
}

/* ================= NEWSLETTER ================= */
.newsletter {
  margin: 100px 20px;
  padding: 20px;
  background: white;
  max-width: 600px;
}

/* ================= BUTTONS ================= */
.language-toggle, .theme-toggle {
  position: fixed;
  right: 15px;
  z-index: 1000;
}

.language-toggle { top: 15px; }
.theme-toggle { top: 60px; }

button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #1f5f2e;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: #d4af37; }

/* ================= CHILL MODE ================= */
.chill-mode-toggle {
  position: fixed;
  bottom: 15px;
  right: 15px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

body.chill-mode {
  background: url('green.gif') center center fixed;
  background-size: cover;
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
  .text-container { margin: 40px 15px; padding: 20px; }
  .exhibition-list { margin: 60px 15px; }
  .exhibition-item { display: block; margin-bottom: 80px; }
  .exhibition-item a { display: block; max-width: 100%; }
  .exhibition-item img { margin-bottom: 12px; }
  .exhibition-item p { display: block; width: fit-content; max-width: 100%; font-size: 16px; padding: 8px 12px; text-align: left; transform: none; }
}

</style>
</head>

<body>

<!-- Buttons -->
<div class="language-toggle">
  <button id="langBtn">DE</button>
</div>

<div class="theme-toggle">
  <button id="themeBtn">VIP</button>
</div>

<!-- Intro -->
<div class="text-container">
  <h1>H0PE ART SERVICE</h1>
  <p id="mainText"
     data-en="H0PE is a curatorial platform founded by Marcus Wagner in Newcastle Upon Tyne in 2024. It aims to provide artists and creators with a space for experimentation, where the focus is on the overall impact of an exhibition rather than individual works. Through open calls, H0PE invites a wide variety of submissions and seeks to transform simple or familiar themes into engaging, thought-provoking displays. The project celebrates creative freedom, curiosity, and playful approaches to contemporary art, welcoming contributions from anyone interested."
     data-de="H0PE ist eine kuratorische Plattform, die 2024 von Marcus Wagner in Newcastle Upon Tyne gegründet wurde. Sie bietet Künstler:innen und Kreativen einen Raum für Experimente, in dem weniger das einzelne Werk, sondern die Gesamtwirkung einer Ausstellung im Vordergrund steht. Durch offene Einreichungen lädt H0PE zu einer großen Vielfalt an Beiträgen ein und verwandelt einfache oder vertraute Themen in spannende, inspirierende Präsentationen. Das Projekt feiert kreative Freiheit, Neugier und spielerische Ansätze zeitgenössischer Kunst und richtet sich an alle, die beitragen möchten.">
     About H0pe...
  </p>
</div>

<!-- Exhibition List -->
<ul class="exhibition-list">
  <li class="exhibition-item">
    <a href="/carshow1.html">
      <img src="assets/car_compressed/marie_nah.jpg" alt="">
      <p>THE CAR SHOW I</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/nothingshow.html">
      <img src="assets/nothingshow/still3.png" alt="">
      <p>THE NOTHING SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/shoeshow2.html">
      <img src="assets/Shoeshow/emy2.jpg" alt="">
      <p>THE SHOE SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/xmasshow.html">
      <img src="assets/xmasshow/1.jpg" alt="">
      <p>HOPE XMAS SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="palmtreeshow.html">
      <img src="assets/palmtree_main/spaceview_4.jpg" alt="">
      <p>PALMTREESHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="soulseller.html">
      <img src="soulseller/queer_27.jpg" alt="">

  <li class="exhibition-item">

<!-- Newsletter -->
<div class="newsletter">
  <p id="newsletterText"
     data-en="Get in touch! Write us an email to join our newsletter and stay updated on upcoming exhibitions and projects."
     data-de="Schreib uns! Sende eine E-Mail, um in unseren Newsletter aufgenommen zu werden und über kommende Ausstellungen und Projekte informiert zu bleiben.">
     Get in touch...
  </p>
  <a href="mailto:hopeartservice@gmx.net">hopeartservice@gmx.net</a>
</div>

<!-- Instagram -->
<div style="margin:40px 20px;">
  <a href="https://www.instagram.com/h__0__p__e__0.0/?hl=de" target="_blank">
    <img src="assets/stuff/Instagram_icon.png" alt="Instagram Link" style="width:60px; height:auto;">
  </a>
</div>

<!-- Chill Mode -->
<div class="chill-mode-toggle" onclick="toggleChillMode()">.</div>

<script>
// ===== Chill Mode =====
function toggleChillMode() {
  document.body.classList.toggle('chill-mode');
}

// ===== Language Switch =====
const langBtn = document.getElementById('langBtn');
let currentLang = 'en';

langBtn.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'de' : 'en';
  langBtn.textContent = currentLang === 'en' ? 'DE' : 'EN';

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute(`data-${currentLang}`);
  });
});

// ===== Theme Switch =====
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('vip-theme');
  themeBtn.textContent = document.body.classList.contains('vip-theme') ? 'RAGGAE' : 'VIP';
});
</script>

</body>
</html>
