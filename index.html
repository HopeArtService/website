<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H0PE ART SERVICE</title>

<!-- VIP Font -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

<!-- Raggae Style Font -->
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-image: url("assets/stuff/breakfree.png");
  background-repeat: repeat;
  background-attachment: fixed;
  background-size: 400px;
  position: relative;
  transition: background 0.4s ease;
}

/* ================= INTRO ================= */
.text-container {
  max-width: 600px;
  margin: 80px 20px;
  padding: 30px;
  background: linear-gradient(135deg, #067506, #f0d507, #d60909);
  color: white;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;

  font-family: 'Righteous', sans-serif;
  cursor: pointer;

  max-height: 140px;
  overflow: hidden;
  transition: max-height 0.6s ease, transform 0.3s ease;
}

.text-container:hover {
  transform: scale(1.02);
}

.text-container.expanded {
  max-height: 1000px;
}

h1 {
  margin-top: 0;
  letter-spacing: 2px;
  font-weight: normal;
}

/* ================= EXHIBITIONS ================= */
.exhibition-list {
  list-style: none;
  padding: 0;
  margin: 120px 20px;
}

.exhibition-item {
  display: flex;
  margin-bottom: 140px;
  position: relative;
}

.exhibition-item a {
  text-decoration: none;
  color: black;
  max-width: 650px;
  display: flex;
  flex-direction: column;
}

.exhibition-item:nth-child(odd) { justify-content: flex-start; }
.exhibition-item:nth-child(even) { justify-content: flex-end; }

.exhibition-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: 0.4s ease;
}

.exhibition-item img:hover { transform: scale(1.02); }

.exhibition-item p {
  margin-top: 15px;
  padding: 10px 14px;
  font-family: "Times New Roman", serif;
  letter-spacing: 1px;
  border-radius: 6px;
  display: inline-block;
  transition: 0.4s ease;
}

.exhibition-item:nth-child(3n+1) p { background: #067506; color: white; }
.exhibition-item:nth-child(3n+2) p { background: #f0d507; color: black; }
.exhibition-item:nth-child(3n+3) p { background: #d60909; color: white; }

.exhibition-item p:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ================= VIP THEME ================= */
body.vip-theme {
  font-family: 'Cinzel Decorative', serif;
  background-color: #fff5d9;
  background-attachment: fixed;
}

#vipPngContainer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

body.vip-theme .vip-png {
  position: absolute;
  width: 300px;
  z-index: 0;
  pointer-events: none;
}

body.vip-theme .text-container {
  font-family: 'Cinzel Decorative', serif;
  background: #d4af37;
  color: black;
  border: 16px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item p {
  font-family: 'Cinzel Decorative', serif;
  background: #d4af37;
  color: black;
  border: 10px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

body.vip-theme .exhibition-item img {
  border: 14px solid transparent;
  border-image: url('assets/stuff/goldenpattern.png') 30 round;
  border-radius: 10px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.4);
}

/* ================= NEWSLETTER ================= */
.newsletter {
  margin: 100px 20px;
  padding: 20px;
  background: white;
  max-width: 600px;
  position: relative;
  z-index: 1;
}

/* ================= BUTTONS ================= */
.language-toggle, .theme-toggle {
  position: fixed;
  right: 15px;
  z-index: 1000;
}

.language-toggle { top: 15px; }
.theme-toggle { top: 60px; }

button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #1f5f2e;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: #d4af37; }

/* ================= CHILL MODE ================= */
.chill-mode-toggle {
  position: fixed;
  bottom: 15px;
  right: 15px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

body.chill-mode {
  background: url('green.gif') center center fixed;
  background-size: cover;
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
  .text-container { margin: 40px 15px; padding: 20px; }
  .exhibition-list { margin: 60px 15px; }
  .exhibition-item { display: block; margin-bottom: 80px; text-align: left; }
  .exhibition-item a { display: block; max-width: 100%; }
  .exhibition-item img { margin-bottom: 12px; }
  .exhibition-item p { display: block; width: fit-content; max-width: 100%; font-size: 16px; padding: 8px 12px; text-align: left; transform: none; }
}

</style>
</head>

<body>

<!-- Buttons -->
<div class="language-toggle">
  <button id="langBtn">DE</button>
</div>

<div class="theme-toggle">
  <button id="themeBtn">VIP</button>
</div>

<!-- Intro -->
<div class="text-container">
  <h1>H0PE ART SERVICE</h1>
  <p id="mainText"
     data-en="H0pe is a curatorial project initiated by Marcus Wagner in Newcastle Upon Tyne in 2024, with the wish to create his own curatorial structure and therefore freedom to present works in an autonomous way..."
     data-de="H0pe ist ein kuratorisches Projekt das von Marcus Wagner inititiert wurde und seither regelmäßig Gruppenausstellungen mittels Open Calls organisiert...">
     About H0pe...
  </p>
</div>

<!-- VIP PNG Layer -->
<div id="vipPngContainer"></div>

<!-- Exhibition List -->
<ul class="exhibition-list">
  <li class="exhibition-item">
    <a href="/carshow1.html">
      <img src="assets/car_compressed/marie_nah.jpg" alt="THE CAR SHOW I">
      <p>THE CAR SHOW I</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/nothingshow.html">
      <img src="assets/nothingshow/still3.png" alt="THE NOTHING SHOW">
      <p>THE NOTHING SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/shoeshow-2.html">
      <img src="assets/Shoeshow/emy2.jpg" alt="THE SHOE SHOW">
      <p>THE SHOE SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="/xmasshow.html">
      <img src="assets/xmasshow/1.jpg" alt="HOPE XMAS SHOW">
      <p>HOPE XMAS SHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="palmtreeshow.html">
      <img src="assets/palmtree_main/spaceview_4.jpg" alt="PALMTREESHOW">
      <p>THE PALMTREESHOW</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="soulseller.html">
      <img src="soulseller/queer_27.jpg" alt="SOULSELLER">
      <p>SOULSELLER — UNHAPPY PAINTER / HAPPY PAINTER WANTS TO EXIST</p>
    </a>
  </li>

  <li class="exhibition-item">
    <a href="gardenofeldon.html">
      <img src="assets/gardenofeldon/garden_titelbild.JPG" alt="GARDEN OF ELDON">
      <p>GARDEN OF ELDON</p>
    </a>
  </li>
</ul>

<script>

// Expand Intro
const textContainer = document.querySelector('.text-container');
textContainer.addEventListener('click', () => {
  textContainer.classList.toggle('expanded');
});

// Language Switch
const langBtn = document.getElementById('langBtn');
let currentLang = 'en';

langBtn.addEventListener('click', () => {
  currentLang = currentLang === 'en' ? 'de' : 'en';
  langBtn.textContent = currentLang === 'en' ? 'DE' : 'EN';

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute(`data-${currentLang}`);
  });
});

</script>

</body>
</html>
